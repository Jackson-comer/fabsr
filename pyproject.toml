[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabsr"
version = "0.1.0"
description = "Fabsr: train ternary LLMs by flipping weights stored as 2-bit codes (no latent weights, update inside backward)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jackson-comer" }]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = [
    "torch>=2.4",
    "transformers>=4.45,<5.18",
    "huggingface_hub",
    "numpy",
    "triton-windows; platform_system == 'Windows'",
    "triton; platform_system != 'Windows'",
]

[project.urls]
Repository = "https://github.com/Jackson-comer/fabsr"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fabsr._core" = ["MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
